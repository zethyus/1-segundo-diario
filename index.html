<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1 Segundo Diário</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            height: 100vh;
            height: -webkit-fill-available;
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
            overflow: hidden;
        }

        /* Container do vídeo ocupando toda a tela */
        #video-wrapper {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Garante que preencha a tela sem bordas pretas */
            transform: scaleX(1); /* Garante que não fique espelhado errado */
        }

        /* Interface sobreposta ao vídeo */
        .overlay-ui {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Botão de Gravar */
        #recordBtn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid white;
            background-color: transparent; /* Transparente com borda, estilo câmera nativa */
            position: relative;
            cursor: pointer;
            outline: none;
        }

        /* O círculo vermelho interno */
        #recordBtn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 66px;
            height: 66px;
            background-color: #ff3b30;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        /* Animação quando está gravando */
        #recordBtn.recording::before {
            width: 30px;
            height: 30px;
            border-radius: 4px; /* Vira um quadrado */
        }

        /* Controles de tempo */
        .settings-bar {
            margin-bottom: 20px;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        select {
            background: transparent;
            color: white;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            outline: none;
        }

        #status {
            margin-top: 10px;
            font-size: 0.8rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="video-wrapper">
        <video id="preview" autoplay muted playsinline></video>
        
        <div class="overlay-ui">
            <div class="settings-bar">
                <select id="duration">
                    <option value="1.0">1 Segundo</option>
                    <option value="1.5">1.5 Segundos</option>
                    <option value="2.0">2 Segundos</option>
                </select>
            </div>

            <button id="recordBtn"></button>
            <p id="status">Toque para gravar</p>
        </div>
    </div>

    <script>
        const preview = document.getElementById('preview');
        const recordBtn = document.getElementById('recordBtn');
        const statusTxt = document.getElementById('status');
        const durationSelect = document.getElementById('duration');

        let stream;
        let mediaRecorder;
        let chunks = [];
        let isRecording = false;

        function getFormattedDate() {
            const d = new Date();
            const dia = String(d.getDate()).padStart(2, '0');
            const mes = String(d.getMonth() + 1).padStart(2, '0');
            const ano = d.getFullYear();
            return `${dia}-${mes}-${ano}`;
        }

        async function initCamera() {
            try {
                // AQUI ESTÁ O TRUQUE PARA FICAR VERTICAL
                // Pedimos uma altura (height) maior que a largura (width)
                // e o exact facingMode para garantir câmera traseira
                const constraints = {
                    audio: true,
                    video: {
                        facingMode: "environment", 
                        width: { ideal: 720 },  
                        height: { ideal: 1280 } 
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                preview.srcObject = stream;
            } catch (err) {
                statusTxt.innerText = "Erro Câmera: " + err.message;
            }
        }

        recordBtn.addEventListener('click', () => {
            if (isRecording || !stream) return;

            isRecording = true;
            chunks = [];
            const durationMS = parseFloat(durationSelect.value) * 1000;

            // Lógica rigorosa para MP4
            let mimeType = '';
            
            // Verifica suporte na ordem de preferência
            if (MediaRecorder.isTypeSupported('video/mp4')) {
                mimeType = 'video/mp4';
            } else if (MediaRecorder.isTypeSupported('video/webm;codecs=h264')) {
                mimeType = 'video/webm;codecs=h264'; // Tenta codec H264 no container WebM
            } else {
                mimeType = 'video/webm'; // Fallback final
            }

            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
            } catch (e) {
                // Se falhar com as opções, tenta sem opções (padrão do navegador)
                mediaRecorder = new MediaRecorder(stream);
            }

            recordBtn.classList.add('recording');
            statusTxt.innerText = "Gravando...";
            
            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) chunks.push(e.data);
            };
            
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                
                const dateStr = getFormattedDate();
                
                // Define extensão baseado no que o navegador realmente conseguiu usar
                let ext = '.webm';
                if (mimeType.includes('mp4')) ext = '.mp4';
                
                a.href = url;
                a.download = `${dateStr}${ext}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                recordBtn.classList.remove('recording');
                statusTxt.innerText = "Salvo!";
                isRecording = false;
            };

            mediaRecorder.start();

            setTimeout(() => {
                if (mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                }
            }, durationMS); 
        });

        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
