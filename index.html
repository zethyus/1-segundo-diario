<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>1 Segundo Pro</title>
    <style>
        /* Reseta tudo para garantir tela cheia */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #000;
            overflow: hidden; /* Remove barras de rolagem */
            width: 100vw;
            height: 100vh;
            /* Suporte para altura dinâmica em mobile */
            height: 100dvh; 
            font-family: sans-serif;
        }

        /* Vídeo fixo no fundo ocupando tudo */
        #video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Cobre a tela sem distorcer */
            z-index: 1;
            transform: scaleX(1); /* Evita espelhamento errado */
        }

        /* Interface flutuante sobre o vídeo */
        .ui-layer {
            position: fixed;
            z-index: 10;
            bottom: 0;
            left: 0;
            width: 100%;
            padding-bottom: 40px;
            padding-bottom: max(40px, env(safe-area-inset-bottom));
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Barra de ferramentas superior */
        .top-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            display: flex;
            gap: 15px;
        }

        /* Botões utilitários (Rotação/Troca Câmera) */
        .icon-btn {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Botão de Gravar Principal */
        #recordBtn {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 4px solid white;
            background-color: transparent;
            position: relative;
            margin-top: 20px;
        }

        #recordBtn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background-color: #ff3b30;
            border-radius: 50%;
            transition: all 0.2s;
        }

        #recordBtn.recording::before {
            width: 35px;
            height: 35px;
            border-radius: 6px;
        }

        /* Seletor de tempo */
        .duration-pill {
            background: rgba(50, 50, 50, 0.7);
            border-radius: 20px;
            padding: 5px 15px;
            color: white;
            font-size: 0.9rem;
            border: 1px solid #555;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        select {
            background: transparent;
            color: white;
            border: none;
            font-weight: bold;
            outline: none;
        }

        #status {
            color: #ccc;
            margin-top: 10px;
            font-size: 0.8rem;
            min-height: 15px;
        }
    </style>
</head>
<body>

    <video id="video-bg" autoplay muted playsinline></video>

    <div class="top-bar">
        <button class="icon-btn" id="rotateBtn" title="Girar Orientação">🔄</button>
        <button class="icon-btn" id="flipBtn" title="Trocar Câmera">📷</button>
    </div>

    <div class="ui-layer">
        <div class="duration-pill">
            <span>⏱️</span>
            <select id="duration">
                <option value="1.0">1s</option>
                <option value="1.5">1.5s</option>
                <option value="2.0">2s</option>
            </select>
        </div>

        <button id="recordBtn"></button>
        <p id="status">Pronto</p>
    </div>

    <script>
        const videoElement = document.getElementById('video-bg');
        const recordBtn = document.getElementById('recordBtn');
        const statusTxt = document.getElementById('status');
        const durationSelect = document.getElementById('duration');
        const rotateBtn = document.getElementById('rotateBtn');
        const flipBtn = document.getElementById('flipBtn');

        let stream;
        let mediaRecorder;
        let chunks = [];
        let isRecording = false;
        
        // Configurações iniciais
        let currentFacingMode = "environment"; // Começa com a traseira
        let isPortrait = true; // Começa tentando vertical

        function getFormattedDate() {
            const d = new Date();
            const dia = String(d.getDate()).padStart(2, '0');
            const mes = String(d.getMonth() + 1).padStart(2, '0');
            const ano = d.getFullYear();
            return `${dia}-${mes}-${ano}`;
        }

        async function startCamera() {
            // Para o stream anterior se existir
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            // Define resolução baseada na orientação desejada
            // Se isPortrait for true, pede Altura > Largura
            const widthIdeal = isPortrait ? 720 : 1280;
            const heightIdeal = isPortrait ? 1280 : 720;

            const constraints = {
                audio: true,
                video: {
                    facingMode: currentFacingMode,
                    width: { ideal: widthIdeal },
                    height: { ideal: heightIdeal }
                }
            };

            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                statusTxt.innerText = isPortrait ? "Modo Vertical" : "Modo Horizontal";
            } catch (err) {
                statusTxt.innerText = "Erro: " + err.message;
            }
        }

        // Botão para trocar orientação (Vertical <-> Horizontal)
        rotateBtn.addEventListener('click', () => {
            isPortrait = !isPortrait; // Inverte o valor
            startCamera(); // Reinicia a câmera com novas medidas
        });

        // Botão para trocar câmera (Traseira <-> Frontal)
        flipBtn.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            startCamera();
        });

        recordBtn.addEventListener('click', () => {
            if (isRecording || !stream) return;

            isRecording = true;
            chunks = [];
            const durationMS = parseFloat(durationSelect.value) * 1000;

            // Tenta MP4 primeiro
            let mimeType = 'video/webm';
            if (MediaRecorder.isTypeSupported('video/mp4')) {
                mimeType = 'video/mp4';
            } else if (MediaRecorder.isTypeSupported('video/webm;codecs=h264')) {
                mimeType = 'video/webm;codecs=h264';
            }

            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
            } catch (e) {
                mediaRecorder = new MediaRecorder(stream);
            }

            recordBtn.classList.add('recording');
            statusTxt.innerText = "Gravando...";
            
            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) chunks.push(e.data);
            };
            
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                
                const dateStr = getFormattedDate();
                let ext = mimeType.includes('mp4') ? '.mp4' : '.webm';
                
                a.href = url;
                a.download = `${dateStr}${ext}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                recordBtn.classList.remove('recording');
                statusTxt.innerText = "Salvo!";
                isRecording = false;
            };

            mediaRecorder.start();

            setTimeout(() => {
                if (mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                }
            }, durationMS); 
        });

        // Inicia a câmera ao carregar
        window.addEventListener('load', startCamera);
    </script>
</body>
</html>
